aid: university-of-calgary
name: University of Calgary
description: 'The University of Calgary is a public research university in Calgary, Alberta and a member of
  the U15 group of Canadian research universities. It operates no central developer portal and no campus-wide
  API programme; what it does operate is a small number of genuinely institution-run scientific and scholarly
  surfaces, and a larger number of vendor-platform tenancies that carry the university''s name. The real institution-operated
  APIs both belong to the Space Remote Sensing group in the Department of Physics and Astronomy: the UCalgary
  Space Remote Sensing API at api.phys.ucalgary.ca, which self-publishes an OpenAPI 3.1 document and includes
  a conformant HAPI 3.3 Heliophysics time-series server, and the AuroraX auroral-science API at api.aurorax.space,
  which runs on the same University of Calgary netblock. Alongside them the university runs its own Open Journal
  Systems installation with a live OAI-PMH endpoint and a keyless MediaWiki Action API for Research Computing
  Services documentation. Everything else is a tenancy: PRISM, the institutional repository, is a DSpace tenant
  on the consortial Scholaris service; the research-data collection is a Dataverse collection on Borealis;
  the academic calendar is on Coursedog; the identity federation is a Microsoft Entra ID tenant. There is
  no course-catalog, transit, dining or campus-life API, and www.ucalgary.ca serves a soft 404 on every unknown
  path, so link presence there is never evidence.'
