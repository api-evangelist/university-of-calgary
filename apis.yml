  detail: 'Two institution-operated API contracts were found, verified live and saved: the UCalgary Space
    Remote Sensing API (OpenAPI 3.1 self-published at api.phys.ucalgary.ca/openapi.json, v1.66.0, 22 paths,
    6 tags) and the AuroraX API (OpenAPI 3.0.1 at api.aurorax.space/api/openapi.json, 33 paths, 8 tags). Both
    hosts resolve inside the ARIN U-CALGARY netblock 136.159.0.0/16. Two further institution-operated deployments
    of shared products were recorded without saving the product''s contract: an OJS 3.4.0.10 OAI-PMH endpoint
    at journalhosting.ucalgary.ca and a MediaWiki 1.43.3 Action API at rcs.ucalgary.ca. Four tenant relationships
    were recorded: PRISM on Scholaris, the research-data collection on Borealis Dataverse, the academic calendar
    on Coursedog, and the SAML/OIDC identity federation on Microsoft Entra ID. No course-catalog, library-discovery,
    transit, dining, room-booking or open-data-portal API is published: api.ucalgary.ca, data.ucalgary.ca,
    developer.ucalgary.ca, courses.ucalgary.ca and catalog.ucalgary.ca do not resolve, open.ucalgary.ca soft-404s,
    and the Coursedog catalog API returns 401 Unauthenticated. Nothing was blocked; every verdict here rests
    on a probe.'
