- aid: university-of-calgary:prism-dspace
  name: PRISM Institutional Repository (DSpace on Scholaris)
  description: PRISM is the University of Calgary's institutional repository — the university's content, the
    university's DOIs, the university's open-access mandate — but it is no longer run by the university. It
