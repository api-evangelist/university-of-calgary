        Input notes:

        - timestamp

        - timestamp is expected to be in UTC

        - only specific dates are valid at this time. A 400 error will be returned if an unsupported date is

        requested. If you want to get a date that we have not enabled support for yet, please contact us.

        - the ''Z'' character at the end of the timestamp is optional, and will be ignored if it is supplied

        - latitude and longitude

        - are to be in geodetic coordinates

        - latitude is currently limited to >=50.0 and =-110 and <-70 and degrees

        - valid values for nrlmsis_model_version are ''00'' and ''2.0''

        - valid values for precipitation_flux_spectral_type are ''gaussian'' and ''maxwellian''

        - intensity parameters are expected to be height-integrated values, and in Rayleighs

        - by default requests are cached; use the ''no_cache'' parameter to disable this functionality


        Output notes:

        - output parameter of the request are toggles the enable/disable each field''s inclusion in the response

        - all output parameters are false by default

        - altitude is in kilometers

        - energy flux: erg/cm2/s

        - characteristic energy: eV

        - emission data: 1-D array -- volume emission rate (1/cm^3/s)

