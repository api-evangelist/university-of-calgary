  /api/v2/atm/inverse:
    post:
      tags:
      - Auroral Transport Model (ATM)
      summary: Perform inverse ATM calculation
      description: 'Perform an inverse calculation using **VERSION 2** of the TREx Auroral Transport Model and the supplied

        input parameters.


        **NOTE**: This version of the model no longer provides extended outputs which are derived when doing a

        subsequent forward request after the inversion determines the energy flux. Instead, we leave this up

        to the user to perform the forward request using the parameters of their choosing. This was done to

        allow further customization of the forward requests which use inversion-derived inputs.


        **NOTE**: As of API version 1.38.0 (released 2025-09-10), the `characteristic_energy` output flag has been

        deprecated. Please use `mean_energy` instead. The characteristic_energy flag will be removed in a later release

        to be determined.


        Input notes:

        - By default requests are cached. Use the ''no_cache'' parameter to disable this functionality

        - Timestamp

        - Timestamp is expected to be in UTC

        - Only specific dates are valid at this time. A 400 error will be returned if an unsupported date is

        requested. If you want to get a date that we have not enabled support for yet, please contact us.

        - the ''Z'' character at the end of the timestamp is optional, and will be ignored if it is supplied

        - Latitude and longitude

        - Expected to be in geodetic coordinates

        - latitude is currently limited to >=50.0 and =-160 and <-75 and degrees

        - Units and defaults

        - intensity_4278: Rayleighs, default is 1000.0

        - intensity_5577: Rayleighs, default is 6000.0

        - intensity_6300: Rayleighs, default is 600.0

        - intensity_8446: Rayleighs, default is 400.0

        - precipitation_flux_spectral_type: valid values are "gaussian" or "maxwellian", default is "gaussian"

        - nrlmsis_model_version: valid values are "00" and "2.0", default is "2.0"

        - Special logic keyword

        - If you would like special logic to be used, the special_logic_keyword parameter can be set with

        a unique keyword provided by UCalgary staff. This is meant as a way to enable support for certain

        special use-cases.


        Output notes:

        - output parameter of the request are toggles the enable/disable each field''s inclusion in the response

        - all output parameters are false by default

        - altitude is in kilometers

        - energy flux: erg/cm2/s

        - mean energy: eV'
      operationId: atm_inverse_api_v2_atm_inverse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/src__atm__v2__schemas_inverse__ATMInverseRequest'
            examples:
              base:
                summary: Default request object
                description: Default field values, adjust accordingly
                value:
                  atm_model_version: '1.0'
                  timestamp: '2024-10-01T06:00:00'
                  geodetic_latitude: 0
                  geodetic_longitude: 0
                  intensity_4278: 1000
                  intensity_5577: 6000
                  intensity_6300: 600
                  intensity_8446: 400
                  precipitation_flux_spectral_type: gaussian
                  nrlmsis_model_version: '2.0'
                  special_logic_keyword: not_applicable
                  output:
                    altitudes: false
                    energy_flux: false
                    mean_energy: false
                    oxygen_correction_factor: false
                  no_cache: false
              example0:
                summary: A simple example
                description: A simple example
                value:
                  timestamp: '2024-01-01T06:00:00'
                  geodetic_latitude: 58.28
                  geodetic_longitude: -103.68
                  intensity_4278: 2300
                  intensity_5577: 11400
                  intensity_6300: 530
                  intensity_8446: 427
                  output:
                    altitudes: true
                    energy_flux: true
                    mean_energy: true
                    oxygen_correction_factor: true
              example1:
                summary: A simple example with all output parameters
                description: A simple example with all output parameters
                value:
                  timestamp: '2024-01-01T06:00:00'
                  geodetic_latitude: 58.28
                  geodetic_longitude: -103.68
                  intensity_4278: 2300
                  intensity_5577: 11400
