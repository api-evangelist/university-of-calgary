openapi: 3.2.0
info:
  title: UCalgary Space Remote Sensing Auroral Transport Model (ATM)…
  description: API providing data and tools for UCalgary Space Remote Sensing
  version: 1.66.0
servers:
- url: https://api.phys.ucalgary.ca
  description: UCalgary Space Remote Sensing API
tags:
- name: Auroral Transport Model (ATM)
  description: Endpoints to utilize the Auroral Transport Model
paths:
  /api/v1/atm/forward:
    post:
      tags:
      - Auroral Transport Model (ATM)
      summary: Perform forward ATM calculation
      description: 'Perform a forward calculation using **VERSION 1** of the TREx Auroral Transport Model and the supplied

        input parameters.


        Input notes:

        - timestamp

        - timestamp is expected to be in UTC, and is valid for any value up to the end of the previous day

        - the ''Z'' character at the end of the timestamp is optional, and will be ignored if it is supplied

        - latitude and longitude are to be in geodetic coordinates (-90 to 90 lat, -180 to 180 lon)

        - maxwellian_characteristic_energy must be specified if the maxwellian_energy_flux is not 0

        - gaussian_peak_energy must be specified if the gaussian_energy_flux is not 0

        - gaussian_spectral_width must be specified if the gaussian_energy_flux is not 0

        - valid values for nrlmsis_model_version are ''00'' and ''2.0''

        - The ATM model is 1D and time-independent. However, the optional parameters timescale_auroral and

        timescale_transport provide limited support for time-dependent and transport process.

        - timescale_auroral (T0) is the duration of the precipitation; default value is 600 sec

        - timescale_transport is defined by L/v0, in which L is the dimension of the auroral structure,

        and v0 is the cross-structure drift speed. Default value is 600 sec.

        - the model quasi-analytically solves the continuity equation under a square input (with time

        duration T0 and spatial width L) input of precipitation. The initial/boundary conditions are

        given by IRI. The output yields the mean density/VER over [0-L] at time T0.

        - units

        - timescale parameters: seconds

        - maxwellian energy flux: erg/cm2/s

        - maxwellian characteristic energy: eV

        - gaussian energy flux: erg/cm2/s

        - gaussian peak energy: eV

        - gaussian spectral width: eV

        - custom spectrum

        - energy in eV, flux in 1/cm2/s/eV

        - energy and flux arrays must be the same length

        - by default requests are cached; use the ''no_cache'' parameter to disable this functionality


        Output notes:

        - output parameter of the request are toggles the enable/disable each field''s inclusion in the response

        - all output parameters are false by default

        - altitude is in kilometers

        - emission data: 1-D array -- volume emission rate (1/cm^3/s)

        - plasma electron density: 1-D array -- density (cm^-3)

        - plasma O2+ density: 1-D array -- density (cm^-3)

        - plasma NO+ density: 1-D array -- density (cm^-3)

        - plasma O+ density: 1-D array -- density (cm^-3)

        - plasma ionisation rate: 1-D array -- ionisation rate (1/cm^3/s)

        - plasma electron temperature: 1-D array -- temperature (K)

        - plasma ion temperature: 1-D array -- temperature (K)

        - plasma peterson conductivity: 1-D array -- conductivity (S/m)

        - plasma hall conductivity: 1-D array -- conductivity (S/m)

        - neutral O2 density: 1-D array -- density (cm^-3)

        - neutral O density: 1-D array -- density (cm^-3)

        - neutral N2 density: 1-D array -- density (cm^-3)

        - neutral N density: 1-D array -- density (cm^-3)

        - neutral temperature: 1-D array -- temperature (K)'
      operationId: atm_forward_api_v1_atm_forward_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/src__atm__v1__schemas_forward__ATMForwardRequest'
            examples:
              base:
                summary: Default request object
                description: Default field values, adjust accordingly
                value:
                  atm_model_version: '1.0'
                  timestamp: '2024-01-01T06:00:00'
                  geodetic_latitude: 0
                  geodetic_longitude: 0
                  maxwellian_energy_flux: 10
                  gaussian_energy_flux: 0
                  maxwellian_characteristic_energy: 5000
                  gaussian_peak_energy: 1000
                  gaussian_spectral_width: 100
                  nrlmsis_model_version: '2.0'
                  oxygen_correction_factor: 1
                  timescale_auroral: 600
                  timescale_transport: 600
                  custom_spectrum:
                    energy: []
                    flux: []
                  output:
                    height_integrated_rayleighs_4278: false
                    height_integrated_rayleighs_5577: false
                    height_integrated_rayleighs_6300: false
                    height_integrated_rayleighs_8446: false
                    height_integrated_rayleighs_lbh: false
                    height_integrated_rayleighs_1304: false
                    height_integrated_rayleighs_1356: false
                    altitudes: false
                    emission_4278: false
                    emission_5577: false
                    emission_6300: false
                    emission_8446: false
                    emission_lbh: false
                    emission_1304: false
                    emission_1356: false
                    plasma_electron_density: false
                    plasma_o2plus_density: false
                    plasma_oplus_density: false
                    plasma_noplus_density: false
                    plasma_ionisation_rate: false
                    plasma_electron_temperature: false
                    plasma_ion_temperature: false
                    plasma_pederson_conductivity: false
                    plasma_hall_conductivity: false
                    neutral_o2_density: false
                    neutral_o_density: false
                    neutral_n2_density: false
                    neutral_n_density: false
                    neutral_temperature: false
                  no_cache: false
              example0:
                summary: A simple example
                description: A simple example
                value:
                  timestamp: '2024-01-01T06:00:00'
                  geodetic_latitude: 51.04
